<body hidden>   
    <div class="page">

        <div class='topbar'>
            <h1>Abyss</h1>
            <div class='tabs'>
                <a class='tab on' data-tab="dive">Expedition</a>

            <details class='settings'>
                <summary>Settings</summary>
                <div class='settings-box'>
                    <label><input type='checkbox'>Calm mode</label>
                </div>
            </details>
        </div>

        <div class='currency'>
            <span class='label'>Sand dollars</span>
            <span class='money' data-state='sandDollars' id="sandDollars">142,805</span>
            <div class="rate">
            <div class="rate">+<span data-state="sandRate">3.2</span>/s</div>
            </div>
        </div>




        <!-- TAB PAGES -->
        <section id="tab-dive" class="tabpage">
            <div class="layout">

                <div class="left">
                    <div class="panel">
                        <div class="row">
                            <h2 class="row">Captain</h2>
                            <h2 class="row">Level: <span data-state="captainLevel">3</span></h2>
                        </div>
                        <div class="row">
                            <button class="floorButton" id="floorMinus">&minus;</button>
                            <div class="center">
                                <div>
                                    <span class="floorLabel">Floor: </span>
                                    <b data-state="floorSelected">9</b>
                                </div>
                                <span class="muted" data-state="floorSelectedName">Twilight</span>
                            </div>
                            <button class="floorButton" id="floorPlus">&plus;</button>
                        </div>


                        <button class="big" id="dive-button">Dive</button>

                        <p class="floorStats">Survival at floor <span data-state="floorSelected">9</span>: <span data-state="survivalRate">94</span>%</p>
                        <p class="floorStats">Your deepest: floor <span data-state="floorRecord">10</span></p>
