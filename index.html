<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abyss</title>
    <link rel="stylesheet" href="style.css">
</head>

<body hidden>   
    <div class="page">

        <div class='topbar'>
            <h1>Abyss</h1>
            <div class='tabs'>
                <a class='tab on' data-tab="dive">Expedition</a>
                <a class='tab' data-tab="divers">Divers</a>
                <!-- <a class='tab' data-tab="shipyard">Shipyard</a>
                <a class='tab' data-tab="upgrades">Upgrades</a> -->
            </div>

            <details class='settings'>
                <summary>Settings</summary>
                <div class='settings-box'>
                    <label><input type='checkbox'>Calm mode</label>
                </div>
            </details>
        </div>

        
        <div class="board">
            <div class="currency">
                <span class='label'>Sand dollars</span>
                <span class='money' data-state='sandDollars' id="sandDollars">0</span>
                <div class="rate">+<span data-state="sandRate">0</span>/s</div>
            </div>

            <div class='upgrades'>
                <span class='label'>Upgrades</span>
                <!-- Filled from the UPGRADES list in data.js -->
                <div class='tiles' id="tiles"></div>

                <!-- The blueprint for one tile. A template is never shown itself. -->
                <template id="tileTemplate">
                    <button class='tile' data-action="buyUpgrade">
                        <span class="tileName"></span>
                        <span class="muted tileCost"></span>
                    </button>
                </template>
            </div>

            <div class="left">
                <div class="panel">
                    <div class="row">
                        <h2 class="row">Captain</h2>
                        <h2 class="row">Level: <span data-state="captainLevel">3</span></h2>
                    </div>
                    <div class="row">
                        <button class="floorButton" id="floorMinus" data-action="floorMinus">&minus;</button>
                        <div class="center">
                            <div>
                                <span class="floorLabel">Floor: </span>
                                <b data-state="floorSelected">9</b>
                            </div>
                            <span class="muted" data-state="floorSelectedName">Twilight</span>
                        </div>
                        <button class="floorButton" id="floorPlus" data-action="floorPlus">&plus;</button>
                    </div>


                    <button class="big" id="dive-button" data-action="dive">Dive</button>

                    <p class="floorStats">Survival at floor <span data-state="floorSelected">9</span>: <span data-state="survivalRate">94</span>%</p>
                    <p class="floorStats">Your deepest: floor <span data-state="floorRecord">1</span></p>
                    <p class="floorStats">XP: <span data-state="totalXP">0</span> / <span data-state="nextLevelXP">500</span></p>
                </div>

                <div class="panel">
                    <h2>Stats</h2>
                    <div class="row statRow">
                        <span>Strength</span>
                        <b data-state="strength" class="statNumber">1</b>
                        <button class="stat-button" data-action="buyStat" data-stat="strength">+</button>
                    </div>
                    <div class="row statRow">
                        <span>Agility</span>
                        <b data-state="agility" class="statNumber">1</b>
                        <button class="stat-button" data-action="buyStat" data-stat="agility">+</button>
                    </div>
                    <div class="row statRow">
                        <span>Intelligence</span>
                        <b data-state="intelligence" class="statNumber">1</b>
                        <button class="stat-button" data-action="buyStat" data-stat="intelligence">+</button>
                    </div>
                </div>

            </div>

            <div class="middle">
                <div class="panel">
                    <h2>Expedition log</h2>
                    <div class="logbox tall" id="logbox">
                        <!-- <div>You dove to floor 8 (Twilight) and found 24 sand dollars.</div>
                        <div>Level up: You are now level 4.</div>
                        <div><span class="muted">Notice</span> Your divers can now follow you down to floor 10.</div>
                        <div class="bad">You were lost at floor 11 and lost 1,248 sand dollars.</div> -->
                    </div>
                </div>
                <div class="panel">
                    <h2>The Flood</h2>
                    <div class="logbox medium" id="floodbox"></div>
                </div>
            </div>

            <div class="side">
                <div class="panel" id="diversPanel">
                    <div class="row">
                        <h2>Divers</h2>
                        <span class="muted"><span data-state="diverCount">0</span> diving</span>
                    </div>

                    <button class="big withPrice" id="hireButton" data-action="hire">
                        <span>Hire diver</span>
                        <span class="price"><span id="hireCost">50</span></span>
                    </button>

                    <span class="label">Risk dial</span>
                    <!-- data-risk matches a key in RISK_DIAL (data.js) -->
                    <div class="riskDial">
                        <button data-action="setRisk" data-risk="veryCareful">Very careful</button>
                        <button data-action="setRisk" data-risk="careful">Careful</button>
                        <button data-action="setRisk" data-risk="bold">Bold</button>
                        <button data-action="setRisk" data-risk="reckless">Reckless</button>
                    </div>
                </div>

                <!-- The Shipyard panel goes here later -->
            </div>
        </div>

        
    </div>

    <!-- One entry point. game.js imports everything else it needs. -->
    <script type="module" src="game.js"></script>
</body>

</html>
